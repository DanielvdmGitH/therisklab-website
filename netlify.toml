# therisklab.ai - Netlify configuration
#
# The therisklab.co -> therisklab.ai permanent redirect is NOT configured here.
# Host-based `from` patterns never match: Netlify canonicalises the request to the
# site's primary domain before the redirect engine runs. It lives in
# netlify/edge-functions/legacy-domain-redirect.js instead.

[[redirects]]
  from = "/insights.html"
  to = "/insights/"
  status = 301
  force = true

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 301
  force = true

[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 301
  force = true

[[redirects]]
  from = "/clients"
  to = "/clients.html"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    # 1 hour hard cache, then revalidate. Was max-age=2592000 (30 days) with no
    # revalidation, which meant replacing an asset in place under the same
    # filename left returning visitors on the old file for up to a month.
    # Netlify sends ETags, so revalidation is a cheap 304.
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
